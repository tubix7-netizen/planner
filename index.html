<title>행사 준비 보드</title>

<style>
/* Layout: single-column mobile run sheet — D-day hero, phase timeline, bottom tab bar + add button */
:root {
  --bg: #F3F4F0;
  --surface: #FFFFFF;
  --line: #DFE2DA;
  --ink: #18222D;
  --muted: #5E6973;
  --tape: #F2C230;          /* gaffer-tape yellow accent */
  --tape-ink: #2A2100;
  --doing: #2F6FD6;
  --done: #2E8B57;
  --late: #D2452F;
  --late-bg: #FBE9E5;
  --chip: #ECEEE8;
  --p1: #3B6FD8; --p2: #2E8F63; --p3: #D46A22; --p4: #8457CB; --p5: #C9467B; --p6: #1B8794;  /* period bar colors, white text on all */
  --shadow: 0 1px 2px rgba(24,34,45,.06), 0 6px 20px rgba(24,34,45,.06);
  --f-body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-num: "Space Grotesk", "IBM Plex Sans KR", ui-monospace, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151A; --surface: #1A2028; --line: #2A323C; --ink: #E8ECEF; --muted: #98A3AD;
  --tape: #F2C230; --tape-ink: #2A2100; --doing: #6FA0F0; --done: #5BBE86; --late: #F07A63; --late-bg: #3A2320;
  --chip: #232B35; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #11151A; --surface: #1A2028; --line: #2A323C; --ink: #E8ECEF; --muted: #98A3AD;
  --tape: #F2C230; --tape-ink: #2A2100; --doing: #6FA0F0; --done: #5BBE86; --late: #F07A63; --late-bg: #3A2320;
  --chip: #232B35; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--doing); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(120px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }

.notice { font-size: 13px; color: var(--muted); background: var(--chip); border-radius: 10px; padding: 10px 12px; }

/* Hero */
.hero { background: var(--ink); color: var(--bg); border-radius: 18px; padding: 18px 18px 16px; display: grid; gap: 10px; position: relative; overflow: hidden; border: 0; text-align: left; width: 100%; }
.hero::after { content: ""; position: absolute; right: -24px; top: 18px; width: 120px; height: 26px; background: var(--tape); transform: rotate(-8deg); opacity: .95; }
.hero .eyebrow { font-size: 12px; letter-spacing: .08em; opacity: .7; }
.hero h1 { margin: 0; font-size: 21px; line-height: 1.3; text-wrap: balance; padding-right: 70px; }
.hero .meta { font-size: 13px; opacity: .75; }
.dday { font-family: var(--f-num); font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.hero .row { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hero .edit { font-size: 12px; opacity: .7; text-decoration: underline; text-underline-offset: 3px; }

/* Progress */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0; font-size: 15px; font-weight: 700; }
.sec-title small { font-weight: 500; color: var(--muted); font-size: 12px; }
.bar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .b-done { background: var(--done); }
.bar .b-doing { background: var(--doing); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { display: grid; gap: 2px; }
.stat b { font-family: var(--f-num); font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.late b { color: var(--late); }

.area-row { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 10px; padding: 6px 0; background: none; border: 0; text-align: left; width: 100%; }
.area-row .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.area-row .pct { font-family: var(--f-num); font-size: 13px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Task list */
.list { display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 10px; }
.task.is-late { border-color: var(--late); background: linear-gradient(90deg, var(--late-bg), var(--surface) 60%); }
.task.is-done .t-title { color: var(--muted); text-decoration: line-through; }
.st { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.st svg { width: 16px; height: 16px; }
.st.doing { border-color: var(--doing); }
.st.doing::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: conic-gradient(var(--doing) 0 50%, transparent 0); }
.st.done { border-color: var(--done); background: var(--done); color: #fff; }
.t-body { min-width: 0; background: none; border: 0; padding: 2px 0 0; text-align: left; display: grid; gap: 4px; }
.t-title { font-weight: 600; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
.t-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; color: var(--muted); align-items: center; }
.t-meta .d { font-family: var(--f-num); font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.late { background: var(--late); color: #fff; }
.pill.doing { background: var(--doing); color: #fff; }
.t-note { font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 13px; padding: 6px 2px; }

/* Phase timeline */
.phase { display: grid; gap: 8px; position: relative; padding-left: 18px; }
.phase::before { content: ""; position: absolute; left: 4px; top: 8px; bottom: -18px; width: 2px; background: var(--line); }
.phase:last-child::before { bottom: 0; }
.phase-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; position: relative; }
.phase-head::before { content: ""; position: absolute; left: -18px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); }
.phase.now .phase-head::before { background: var(--tape); border-color: var(--tape-ink); }
.phase-head h3 { margin: 0; font-size: 16px; }
.phase-head .range { font-size: 12px; color: var(--muted); font-family: var(--f-num); }
.phase-head .now-tag { font-size: 11px; font-weight: 700; background: var(--tape); color: var(--tape-ink); padding: 1px 8px; border-radius: 4px; }
.phase-head .cnt { margin-left: auto; font-size: 12px; color: var(--muted); font-family: var(--f-num); }

/* Area filter */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 99px; font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: flex; gap: 4px; background: var(--chip); padding: 3px; border-radius: 10px; }
.seg button { flex: 1; border: 0; background: none; padding: 6px 0; border-radius: 8px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }

/* Bottom nav + FAB */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.nav button { border: 0; background: none; padding: 10px 0 9px; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 700; }
.fab { position: fixed; z-index: 21; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); height: 52px; padding: 0 20px 0 16px; border-radius: 26px; border: 0; background: var(--tape); color: var(--tape-ink); font-weight: 700; display: flex; align-items: center; gap: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.fab svg { width: 20px; height: 20px; }

/* Sheet */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(10,14,18,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 90%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 0; }
.sheet h2 { margin: 0; font-size: 18px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 11px 12px; font-size: 16px; }
.field textarea { min-height: 72px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.actions { display: flex; gap: 8px; }
.btn { flex: 1; border: 1px solid var(--line); background: var(--surface); padding: 13px; border-radius: 12px; font-weight: 600; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.danger { color: var(--late); border-color: var(--late); flex: none; padding-inline: 16px; }
.btn.danger.armed { background: var(--late); color: #fff; }
.btn[disabled] { opacity: .5; }

/* Calendar */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 4px 4px; display: grid; }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 11px; color: var(--muted); text-align: center; padding: 4px 0 6px; }
.dow span:first-child { color: var(--late); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; padding: 2px 0 6px; border-top: 1px solid var(--line); }
.day { grid-row: 1; border: 0; background: none; padding: 3px 0 2px; display: grid; justify-items: center; align-content: start; gap: 2px; border-radius: 8px; min-height: 46px; }

<body>
<main class="wrap" id="app" aria-live="polite">
  <div class="loading" aria-label="불러오는 중"><div></div><div></div><div></div></div>
</main>

<nav class="nav" aria-label="화면 전환">
  <div class="nav-in">
    <button type="button" id="nav-home" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>오늘</button>
    <button type="button" id="nav-plan" data-tab="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>한 달 플랜</button>
    <button type="button" id="nav-area" data-tab="area">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>업무별</button>
  </div>
</nav>
<button type="button" class="fab" id="fab-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>할 일 추가</button>
<div id="sheet-root"></div>

<script>
(() => {
  const AREAS = ["기획·총괄", "장소·시설", "섭외·연사", "홍보·마케팅", "물품·디자인", "예산·정산", "인력·운영"];
  const PHASES = [
    { key: "w4", label: "한 달 전", min: 22, max: 9999 },
    { key: "w3", label: "3주 전", min: 15, max: 21 },
    { key: "w2", label: "2주 전", min: 8, max: 14 },
    { key: "w1", label: "마지막 주", min: 1, max: 7 },
    { key: "d0", label: "행사 당일", min: 0, max: 0 },
    { key: "after", label: "행사 후", min: -9999, max: -1 },
  ];
  const STATUS_NEXT = { todo: "doing", doing: "done", done: "todo" };
  const STATUS_LABEL = { todo: "할 일", doing: "진행 중", done: "완료" };
  const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
  const DAY = 86400000;

  let localMode = false;
  let db = null, info = {}, tasks = [], periods = [], loaded = false, stale = false, readOnly = false, offline = false;
  let tab = "home", areaFilter = "전체", statusFilter = "open", planMode = "cal", selDay = null;
  const PCOLORS = ["p1", "p2", "p3", "p4", "p5", "p6"];
  const pcolor = k => `var(--${PCOLORS.includes(k) ? k : "p1"})`;

  // ---------- helpers ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;

  }
  const svg = (inner) => { const t = document.createElement("template"); t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`; return t.content.firstChild; };
  function parseDate(s) { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function eventDate() { return parseDate(info.date); }
  function daysLeft() { const e = eventDate(); return e ? Math.round((e - today()) / DAY) : null; }
  function dueOf(t) { const e = eventDate(); return e ? new Date(e.getTime() - (Number(t.dday) || 0) * DAY) : null; }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function ddOf(d) { const e = eventDate(); return Math.round((e - d) / DAY); }
  function isoOf(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  function periodsOn(dd) { return periods.filter(p => dd <= Number(p.startD) && dd >= Number(p.endD)); }
  function ptags(list) { return list.length ? h("span", { class: "ptags" }, list.map(p => h("span", { class: "ptag", style: `background:${pcolor(p.color)}` }, p.name || "기간"))) : null; }
  function fmt(d) { return `${d.getMonth() + 1}/${d.getDate()}(${WEEK[d.getDay()]})`; }
  function ddLabel(n) { n = Number(n) || 0; return n > 0 ? `D-${n}` : n === 0 ? "D-DAY" : `D+${-n}`; }
  function isLate(t) { const dl = daysLeft(); return dl != null && t.status !== "done" && (Number(t.dday) || 0) > dl; }
  function sortTasks(a, b) { return (Number(b.dday) || 0) - (Number(a.dday) || 0) || String(a.title).localeCompare(String(b.title), "ko"); }
  function areaList() { const s = new Set(AREAS); tasks.forEach(t => t.area && s.add(t.area)); return [...s]; }
  function toast(msg) { const el = h("div", { class: "toast", role: "status" }, msg); document.body.append(el); setTimeout(() => el.remove(), 2200); }
  function counts(list) { const c = { todo: 0, doing: 0, done: 0, late: 0 }; list.forEach(t => { c[t.status in c ? t.status : "todo"]++; if (isLate(t)) c.late++; }); return c; }

  // ---------- data ----------
  async function save(fn, okMsg) {
    if (!db || readOnly) { toast(offline ? "로그인해야 저장할 수 있어요" : "보기 전용이라 수정할 수 없어요"); return false; }
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) {
      if (e && e.code === "invalid_argument") { readOnly = true; toast("이 링크는 보기 전용이에요. 편집 권한을 요청하세요."); render(); }
      else if (e && e.code === "quota_exceeded") toast("저장 공간이 가득 찼어요. 완료된 일을 정리해 주세요.");

      return false;
    }
  }
  function cycleStatus(t) {
    const next = STATUS_NEXT[t.status] || "doing";
    save(() => db.doc("tasks/" + t.id).update({ status: next, updatedAt: Date.now() }));
  }

  // ---------- views ----------
  function taskRow(t, opts = {}) {
    const late = isLate(t), due = dueOf(t), st = t.status || "todo";
    return h("div", { class: `task${late ? " is-late" : ""}${st === "done" ? " is-done" : ""}` },
      h("button", { type: "button", class: `st ${st}`, "aria-label": `상태: ${STATUS_LABEL[st]} (눌러서 바꾸기)`, onclick: () => cycleStatus(t) }, st === "done" ? svg('<path d="M5 12l5 5 9-10"/>') : null),
      h("button", { type: "button", class: "t-body", onclick: () => openTask(t) },
        h("span", { class: "t-title" }, t.title || "(제목 없음)"),
        h("span", { class: "t-meta" },
          h("span", { class: "d" }, ddLabel(t.dday)),
          due ? h("span", null, fmt(due)) : null,
          opts.hideArea ? null : h("span", { class: "pill" }, t.area || "기타"),
          t.owner ? h("span", null, "· " + t.owner) : null,
          late ? h("span", { class: "pill late" }, "기한 지남") : st === "doing" ? h("span", { class: "pill doing" }, "진행 중") : null),
        t.note ? h("span", { class: "t-note" }, t.note) : null));
  }
  function list(items, opts, emptyMsg) {
    return items.length ? h("div", { class: "list" }, items.map(t => taskRow(t, opts))) : h("p", { class: "empty" }, emptyMsg);
  }
  function progressBar(c) {
    const total = c.todo + c.doing + c.done || 1;
    return h("div", { class: "bar", role: "img", "aria-label": `완료 ${c.done}, 진행 중 ${c.doing}, 남은 일 ${c.todo}` },
      h("i", { class: "b-done", style: `width:${c.done / total * 100}%` }), h("i", { class: "b-doing", style: `width:${c.doing / total * 100}%` }));
  }

  function hero() {
    const dl = daysLeft(), e = eventDate();
    const big = dl == null ? "D-?" : dl > 0 ? `D-${dl}` : dl === 0 ? "D-DAY" : `D+${-dl}`;
    return h("button", { type: "button", class: "hero", onclick: openSettings, "aria-label": "행사 정보 수정" },
      h("span", { class: "eyebrow" }, "행사 준비 현황"),
      h("h1", null, info.name || "행사 이름을 정해주세요"),
      h("span", { class: "row" },
        h("span", { class: "dday" }, big),
        h("span", { class: "meta" }, e ? `${e.getFullYear()}. ${fmt(e)}${info.place ? " · " + info.place : ""}` : "날짜를 넣으면 일정이 계산돼요")),
      dl != null ? ptags(periodsOn(dl)) : null,
      h("span", { class: "edit" }, e ? "행사 정보 수정" : "행사 날짜 설정하기"));
  }

  function viewHome() {
    const c = counts(tasks), total = tasks.length, pct = total ? Math.round(c.done / total * 100) : 0;
    const dl = daysLeft();
    const late = tasks.filter(isLate).sort(sortTasks);
    const soon = dl == null
      ? tasks.filter(t => t.status !== "done").sort(sortTasks).slice(0, 5)
      : tasks.filter(t => t.status !== "done" && !isLate(t) && (Number(t.dday) || 0) <= dl && (Number(t.dday) || 0) >= dl - 6).sort(sortTasks);
    const areaRows = areaList().map(a => {
      const items = tasks.filter(t => (t.area || "기타") === a); if (!items.length) return null;
      const ac = counts(items), p = Math.round(ac.done / items.length * 100);
      return h("button", { type: "button", class: "area-row", onclick: () => { areaFilter = a; setTab("area"); } },
        h("span", { class: "name" }, a), progressBar(ac), h("span", { class: "pct" }, p + "%"));
    }).filter(Boolean);

    return [
      hero(),
      h("section", { class: "card", "aria-label": "전체 진행률" },
        h("h2", { class: "sec-title" }, "전체 진행률", h("small", null, `${c.done}/${total} 완료 · ${pct}%`)),
        progressBar(c),
        h("div", { class: "stats" },
          h("div", { class: "stat" }, h("b", null, c.todo), h("span", null, "남은 일")),
          h("div", { class: "stat" }, h("b", null, c.doing), h("span", null, "진행 중")),
          h("div", { class: "stat" }, h("b", null, c.done), h("span", null, "완료")),
          h("div", { class: "stat late" }, h("b", null, c.late), h("span", null, "기한 지남")))),
      late.length ? h("section", { class: "list" }, h("h2", { class: "sec-title" }, "놓친 일", h("small", null, `${late.length}건`)), list(late, {}, "")) : null,
      h("section", { class: "list" },
        h("h2", { class: "sec-title" }, dl == null ? "먼저 할 일" : "이번 주 할 일", h("small", null, dl == null ? "" : "앞으로 7일")),
        list(soon, {}, total ? "이번 주에 마감인 일이 없어요." : "아직 할 일이 없어요. 아래 ‘할 일 추가’로 시작하세요.")),
      areaRows.length ? h("section", { class: "card" }, h("h2", { class: "sec-title" }, "업무별 준비 상황", h("small", null, "눌러서 보기")), areaRows) : null,
    ];
  }

  function viewPlan() {
    const title = h("h2", { class: "sec-title" }, "한 달 플랜", h("small", null, planMode === "cal" ? "날짜를 눌러 할 일 보기" : "D-30 → 행사 후"));
    const seg = h("div", { class: "seg", role: "group", "aria-label": "보기 방식" },
      [["cal", "달력"], ["list", "단계별 목록"]].map(([k, l]) => h("button", { type: "button", "aria-pressed": String(k === planMode), onclick: () => { planMode = k; render(); } }, l)));
    if (planMode === "list") return [title, seg, ...viewPlanList()];
    const e = eventDate();
    if (!e) return [title, seg, h("div", { class: "card" },
      h("p", { class: "empty" }, "행사 날짜를 정하면 D-day 기준으로 한 달 달력과 기간 막대가 그려져요."),
      h("button", { type: "button", class: "btn primary", onclick: openSettings }, "행사 날짜 설정하기"))];

    const ds = tasks.map(t => Number(t.dday) || 0), ps = periods.flatMap(p => [Number(p.startD) || 0, Number(p.endD) || 0]);
    const hi = Math.max(30, ...ds, ...ps), lo = Math.min(0, ...ds, ...ps);
    const first = addDays(e, -hi), last = addDays(e, -lo);
    const dl = daysLeft();
    if (selDay == null || selDay > hi || selDay < lo) selDay = dl != null && dl <= hi && dl >= lo ? dl : 0;
    const byDay = {};
    tasks.forEach(t => { const d = Number(t.dday) || 0; (byDay[d] = byDay[d] || []).push(t); });

    const cal = h("div", { class: "cal", role: "grid", "aria-label": "한 달 준비 달력" },
      h("div", { class: "dow", "aria-hidden": "true" }, WEEK.map(w => h("span", null, w))));
    for (let ws = addDays(first, -first.getDay()); ws <= last; ws = addDays(ws, 7)) {
      const week = h("div", { class: "week", role: "row" });
      for (let i = 0; i < 7; i++) {
        const d = addDays(ws, i), dd = ddOf(d), list = byDay[dd] || [];
        const inRange = d >= first && d <= last;
        const dots = h("span", { class: "dots", "aria-hidden": "true" },
          list.slice(0, 3).map(t => h("i", { class: isLate(t) ? "late" : t.status || "todo" })),
          list.length > 3 ? h("b", null, "+" + (list.length - 3)) : null);
        week.append(h("button", {
          type: "button", role: "gridcell",
          class: `day${i === 0 ? " sun" : ""}${inRange ? "" : " out"}${dd === dl ? " today" : ""}${dd === 0 ? " event" : ""}${dd === selDay ? " sel" : ""}`,
          style: `grid-column:${i + 1}`,
          "aria-label": `${fmt(d)} ${ddLabel(dd)}${dd === 0 ? " 행사일" : ""}, 할 일 ${list.length}건`,
          "aria-selected": String(dd === selDay),
          onclick: () => { selDay = dd; render(); },
        }, h("span", { class: "mon" }, d.getDate() === 1 || (i === 0 && ws <= first) ? `${d.getMonth() + 1}월` : ""), h("span", { class: "n" }, d.getDate()), dots));
      }
      // period bars for this week, packed into lanes
      const wsDD = ddOf(ws);
      const segs = periods.map(p => {
        const sD = Number(p.startD) || 0, eD = Number(p.endD) || 0;
        const cols = [0, 1, 2, 3, 4, 5, 6].filter(i => { const dd = wsDD - i; return dd <= sD && dd >= eD; });
        if (!cols.length) return null;
        const s = cols[0], en = cols[cols.length - 1];
        return { p, s, en, cl: wsDD - s < sD, cr: wsDD - en > eD };
      }).filter(Boolean).sort((a, b) => a.s - b.s || (b.en - b.s) - (a.en - a.s));
      const laneEnd = [];
      for (const sg of segs) {
        let lane = laneEnd.findIndex(x => x < sg.s);
        if (lane === -1) { lane = laneEnd.length; laneEnd.push(sg.en); } else laneEnd[lane] = sg.en;
        week.append(h("button", {
          type: "button", class: `pbar${sg.cl ? " cl" : ""}${sg.cr ? " cr" : ""}`,
          style: `grid-row:${lane + 2};grid-column:${sg.s + 1} / ${sg.en + 2};background:${pcolor(sg.p.color)}`,
          "aria-label": `${sg.p.name || "기간"} 기간 수정`, onclick: () => openPeriod(sg.p),
        }, sg.p.name || "기간"));
      }
      cal.append(week);
    }
    cal.append(h("div", { class: "cal-legend", "aria-hidden": "true" },
      h("span", null, h("span", { class: "dots" }, h("i", { class: "todo" })), "할 일"),
      h("span", null, h("span", { class: "dots" }, h("i", { class: "doing" })), "진행 중"),
      h("span", null, h("span", { class: "dots" }, h("i", { class: "done" })), "완료"),
      h("span", null, h("span", { class: "dots" }, h("i", { class: "late" })), "기한 지남")));

    const selDate = addDays(e, -selDay), selTasks = (byDay[selDay] || []).slice().sort(sortTasks);
    const daySec = h("section", { class: "list" },
      h("h2", { class: "sec-title" }, `${fmt(selDate)} · ${ddLabel(selDay)}`, h("small", null, `할 일 ${selTasks.length}건`)),
      ptags(periodsOn(selDay)),
      list(selTasks, {}, "이 날 마감인 할 일이 없어요."),
      readOnly || offline ? null : h("button", { type: "button", class: "btn", onclick: () => openTask(null, selDay) }, "이 날에 할 일 추가"));

    const plist = periods.slice().sort((a, b) => (Number(b.startD) || 0) - (Number(a.startD) || 0));
    const perSec = h("section", { class: "list" },
      h("h2", { class: "sec-title" }, "기간 설정", readOnly || offline ? null : h("button", { type: "button", class: "btn small", onclick: () => openPeriod(null) }, "+ 기간 추가")),
      plist.length ? plist.map(p => {

    try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!state || typeof state !== "object") state = JSON.parse(JSON.stringify(SEED));
    for (const c of ["event", "tasks", "periods"]) state[c] = state[c] || {};
    const subs = new Set();
    const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} subs.forEach(f => f()); };
    const meta = { fromCache: false, hasPendingWrites: false };
    const snap = (c, id) => ({ id, exists: !!state[c][id], data: () => state[c][id], metadata: meta });
    const docRef = (c, id) => ({
      id,
      get: async () => snap(c, id),
      set: async d => { state[c][id] = { ...d }; persist(); },
      update: async d => { if (!state[c][id]) throw { code: "invalid_argument" }; state[c][id] = { ...state[c][id], ...d }; persist(); },
      delete: async () => { delete state[c][id]; persist(); },
      onSnapshot: next => { const f = () => next(snap(c, id)); subs.add(f); setTimeout(f); return () => subs.delete(f); },
    });
    const colRef = c => ({
      doc: id => docRef(c, id || "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7)),
      add: async d => { const r = colRef(c).doc(); await r.set(d); return r; },
      onSnapshot: next => { const f = () => { const docs = Object.keys(state[c]).map(id => snap(c, id)); next({ docs, size: docs.length, empty: !docs.length, metadata: meta }); }; subs.add(f); setTimeout(f); return () => subs.delete(f); },
    });
    return { doc: p => { const [c, id] = p.split("/"); return docRef(c, id); }, collection: colRef };
  }

  async function boot() {
    db = window.claude ? await window.claude.use("db").catch(() => null) : null;
    if (!db) { db = localDB(); localMode = true; }
    const user = localMode ? null : await window.claude.use("user").catch(() => null);
    if (user && (await user.can("data.write")) === false) readOnly = true;
    const timer = setTimeout(() => { stale = true; render(); }, 10000);
    db.doc("event/info").onSnapshot(s => { info = s.exists ? s.data() : {}; render(); }, () => {});
    db.collection("periods").onSnapshot(s => { periods = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
    db.collection("tasks").onSnapshot(s => {
      tasks = s.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!s.metadata.fromCache) { clearTimeout(timer); stale = false; }
      loaded = true; render();
    }, () => { clearTimeout(timer); loaded = true; stale = true; render(); });
  }
  render();
  boot();
})();
</script>
</body>
</html>
