<title>행사 준비 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: single-column mobile run sheet — event switcher, D-day hero, focus list, bottom tab bar */
:root {
  --bg: #F3F4F0;
  --surface: #FFFFFF;
  --line: #DFE2DA;
  --ink: #18222D;
  --muted: #5E6973;
  --tape: #F2C230;          /* gaffer-tape yellow accent */
  --tape-ink: #2A2100;
  --doing: #2F6FD6;
  --done: #2E8B57;
  --late: #D2452F;
  --late-bg: #FBE9E5;
  --chip: #ECEEE8;
  --p1: #3B6FD8; --p2: #2E8F63; --p3: #D46A22; --p4: #8457CB; --p5: #C9467B; --p6: #1B8794;  /* period bar colors, white text on all */
  --shadow: 0 1px 2px rgba(24,34,45,.06), 0 6px 20px rgba(24,34,45,.06);
  --f-body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-num: "Space Grotesk", "IBM Plex Sans KR", ui-monospace, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151A; --surface: #1A2028; --line: #2A323C; --ink: #E8ECEF; --muted: #98A3AD;
  --tape: #F2C230; --tape-ink: #2A2100; --doing: #6FA0F0; --done: #5BBE86; --late: #F07A63; --late-bg: #3A2320;
  --chip: #232B35; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #11151A; --surface: #1A2028; --line: #2A323C; --ink: #E8ECEF; --muted: #98A3AD;
  --tape: #F2C230; --tape-ink: #2A2100; --doing: #6FA0F0; --done: #5BBE86; --late: #F07A63; --late-bg: #3A2320;
  --chip: #232B35; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--doing); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }

.notice { font-size: 13px; color: var(--muted); background: var(--chip); border-radius: 10px; padding: 10px 12px; margin: 0; }

/* Event switcher */
.evbar { display: flex; align-items: center; gap: 8px; }
.ev-switch { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; text-align: left; }
.ev-switch .lbl { font-size: 11px; color: var(--muted); flex: none; }
.ev-switch .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ev-switch svg { width: 16px; height: 16px; flex: none; margin-left: auto; color: var(--muted); }
.ev-count { font-family: var(--f-num); font-size: 11px; background: var(--chip); color: var(--muted); border-radius: 99px; padding: 0 7px; flex: none; }

/* Hero */
.hero { background: var(--ink); color: var(--bg); border-radius: 18px; padding: 18px 18px 16px; display: grid; gap: 10px; position: relative; overflow: hidden; border: 0; text-align: left; width: 100%; }
.hero::after { content: ""; position: absolute; right: -24px; top: 18px; width: 120px; height: 26px; background: var(--tape); transform: rotate(-8deg); opacity: .95; }
.hero .eyebrow { font-size: 12px; letter-spacing: .08em; opacity: .7; }
.hero h1 { margin: 0; font-size: 21px; line-height: 1.3; text-wrap: balance; padding-right: 70px; }
.hero .meta { font-size: 13px; opacity: .75; }
.dday { font-family: var(--f-num); font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.hero .row { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hero .edit { font-size: 12px; opacity: .7; text-decoration: underline; text-underline-offset: 3px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.sec-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0; font-size: 15px; font-weight: 700; }
.sec-title small { font-weight: 500; color: var(--muted); font-size: 12px; }

/* Task list */
.list { display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 10px; }
.card .task { background: var(--bg); }
.task.is-late { border-color: var(--late); background: linear-gradient(90deg, var(--late-bg), var(--surface) 60%); }
.task.is-done .t-title { color: var(--muted); text-decoration: line-through; }
.st { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.st svg { width: 16px; height: 16px; }
.st.doing { border-color: var(--doing); }
.st.doing::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: conic-gradient(var(--doing) 0 50%, transparent 0); }
.st.done { border-color: var(--done); background: var(--done); color: #fff; }
.t-body { min-width: 0; background: none; border: 0; padding: 2px 0 0; text-align: left; display: grid; gap: 4px; }
.t-title { font-weight: 600; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
.t-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; color: var(--muted); align-items: center; }
.t-meta .d { font-family: var(--f-num); font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.late { background: var(--late); color: #fff; }
.pill.doing { background: var(--doing); color: #fff; }
.t-note { font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 13px; padding: 6px 2px; margin: 0; }
.starter { display: grid; gap: 12px; justify-items: start; }
.starter h2 { margin: 0; font-size: 17px; }
.starter p { margin: 0; color: var(--muted); font-size: 14px; }

/* Phase timeline */
.phase { display: grid; gap: 8px; position: relative; padding-left: 18px; }
.phase::before { content: ""; position: absolute; left: 4px; top: 8px; bottom: -18px; width: 2px; background: var(--line); }
.phase:last-child::before { bottom: 0; }
.phase-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; position: relative; }
.phase-head::before { content: ""; position: absolute; left: -18px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); }
.phase.now .phase-head::before { background: var(--tape); border-color: var(--tape-ink); }
.phase-head h3 { margin: 0; font-size: 16px; }
.phase-head .range { font-size: 12px; color: var(--muted); font-family: var(--f-num); }
.phase-head .now-tag { font-size: 11px; font-weight: 700; background: var(--tape); color: var(--tape-ink); padding: 1px 8px; border-radius: 4px; }

.seg { display: flex; gap: 4px; background: var(--chip); padding: 3px; border-radius: 10px; }
.seg button { flex: 1; border: 0; background: none; padding: 6px 0; border-radius: 8px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }

/* Area cards */
.area-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.area-name { border: 0; background: none; padding: 0; font-size: 16px; font-weight: 700; text-align: left; display: flex; align-items: center; gap: 6px; min-width: 0; }
.area-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.area-name svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
.area-sub { font-size: 12px; color: var(--muted); }
.add-line { border: 1px dashed var(--line); background: none; border-radius: 12px; padding: 10px; color: var(--muted); font-weight: 600; font-size: 14px; }

/* Bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.nav button { border: 0; background: none; padding: 10px 0 9px; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 700; }

/* Sheet */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(10,14,18,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 90%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 0; }
.sheet h2 { margin: 0; font-size: 18px; }
.field { display: grid; gap: 6px; }
.field label, .field .lab { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 11px 12px; font-size: 16px; }
.field textarea { min-height: 72px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.actions { display: flex; gap: 8px; }
.btn { flex: 1; border: 1px solid var(--line); background: var(--surface); padding: 13px; border-radius: 12px; font-weight: 600; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.tape { background: var(--tape); color: var(--tape-ink); border-color: var(--tape); }
.btn.danger { color: var(--late); border-color: var(--late); flex: none; padding-inline: 16px; }
.btn.danger.armed { background: var(--late); color: #fff; }
.btn.small { flex: none; padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .5; }

/* Event list rows */
.ev-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 4px 6px 4px 4px; }
.ev-row.cur { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.ev-main { border: 0; background: none; text-align: left; padding: 8px; display: grid; gap: 2px; min-width: 0; border-radius: 8px; }
.ev-main .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-main .mt { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ev-main .dd { font-family: var(--f-num); font-weight: 700; color: var(--ink); }
.now-tag { font-size: 11px; font-weight: 700; background: var(--tape); color: var(--tape-ink); padding: 1px 8px; border-radius: 4px; }

/* Calendar */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 4px 4px; display: grid; }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 11px; color: var(--muted); text-align: center; padding: 4px 0 6px; }
.dow span:first-child { color: var(--late); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; padding: 2px 0 6px; border-top: 1px solid var(--line); }
.day { grid-row: 1; border: 0; background: none; padding: 3px 0 2px; display: grid; justify-items: center; align-content: start; gap: 2px; border-radius: 8px; min-height: 46px; }
.day .mon { font-size: 9px; color: var(--muted); line-height: 1; height: 9px; }
.day .n { font-family: var(--f-num); font-size: 13px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.day.sun .n { color: var(--late); }
.day.out { opacity: .35; }
.day.today .n { box-shadow: inset 0 0 0 2px var(--ink); }
.day.event .n { background: var(--tape); color: var(--tape-ink); font-weight: 700; }
.day.sel { background: var(--chip); }
.dots { display: flex; gap: 2px; height: 6px; align-items: center; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.dots i.doing { background: var(--doing); } .dots i.done { background: var(--done); } .dots i.late { background: var(--late); }
.dots b { font-size: 8px; color: var(--muted); font-weight: 600; line-height: 1; }
.pbar { height: 18px; border-radius: 5px; color: #fff; font-size: 10.5px; font-weight: 600; line-height: 18px; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 0; text-align: left; margin: 0 2px; min-width: 0; }
.pbar.cl { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 0; }
.pbar.cr { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); padding: 2px 4px; }
.cal-legend span { display: inline-flex; align-items: center; gap: 4px; }
.period-row { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; }
.period-row .sw { width: 6px; align-self: stretch; border-radius: 3px; }
.period-row .pn { font-weight: 600; }
.period-row .pd { font-size: 12px; color: var(--muted); font-family: var(--f-num); }
.period-row .len { font-size: 12px; color: var(--muted); }
.ptags { display: flex; flex-wrap: wrap; gap: 6px; }
.ptag { font-size: 12px; font-weight: 600; color: #fff; padding: 2px 9px; border-radius: 99px; }
.hero .ptags { position: relative; z-index: 1; }
.swatches { display: flex; gap: 12px; flex-wrap: wrap; padding: 4px 2px; }
.swatches label { width: 32px; height: 32px; border-radius: 50%; position: relative; cursor: pointer; }
.swatches input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.swatches label:has(input:checked) { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }
.swatches label:has(input:focus-visible) { outline: 2px solid var(--doing); outline-offset: 4px; }

.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: 13px; max-width: calc(100% - 32px); }

.loading { display: grid; gap: 8px; }
.loading div { height: 54px; border-radius: 12px; background: var(--chip); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>

</head>
<body>
<main class="wrap" id="app" aria-live="polite">
  <div class="loading" aria-label="불러오는 중"><div></div><div></div><div></div></div>
</main>

<nav class="nav" aria-label="화면 전환">
  <div class="nav-in">
    <button type="button" id="nav-home" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>지금 집중</button>
    <button type="button" id="nav-plan" data-tab="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>한 달 플랜</button>
    <button type="button" id="nav-area" data-tab="area">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>업무별</button>
  </div>
</nav>
<div id="sheet-root"></div>

<script>
(() => {
  const PHASES = [
    { key: "w4", label: "한 달 전", min: 22, max: 9999 },
    { key: "w3", label: "3주 전", min: 15, max: 21 },
    { key: "w2", label: "2주 전", min: 8, max: 14 },
    { key: "w1", label: "마지막 주", min: 1, max: 7 },
    { key: "d0", label: "행사 당일", min: 0, max: 0 },
    { key: "after", label: "행사 후", min: -9999, max: -1 },
  ];
  const STATUS_NEXT = { todo: "doing", doing: "done", done: "todo" };
  const STATUS_LABEL = { todo: "할 일", doing: "진행 중", done: "완료" };
  const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
  const DAY = 86400000;
  const PCOLORS = ["p1", "p2", "p3", "p4", "p5", "p6"];
  const pcolor = k => `var(--${PCOLORS.includes(k) ? k : "p1"})`;
  const FOCUS_KEY = "event-prep-focus";

  let db = null, localMode = false, readOnly = false, noStore = false;
  let events = [], cur = null, areas = [], tasks = [], periods = [];
  let eventsLoaded = false, evLoaded = false, stale = false, unsubs = [];
  let tab = "home", statusFilter = "open", planMode = "cal", selDay = null;

  // ---------- helpers ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
    return el;
  }
  const svg = (inner, w = 3) => { const t = document.createElement("template"); t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`; return t.content.firstChild; };
  function parseDate(s) { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function curEvent() { return events.find(e => e.id === cur) || null; }
  function evDays(ev) { const d = parseDate(ev && ev.date); return d ? Math.round((d - today()) / DAY) : null; }
  function eventDate() { const e = curEvent(); return e ? parseDate(e.date) : null; }
  function daysLeft() { return evDays(curEvent()); }
  function dueOf(t) { const e = eventDate(); return e ? addDays(e, -(Number(t.dday) || 0)) : null; }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function ddOf(d) { return Math.round((eventDate() - d) / DAY); }
  function isoOf(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  function fmt(d) { return `${d.getMonth() + 1}/${d.getDate()}(${WEEK[d.getDay()]})`; }
  function ddLabel(n) { n = Number(n) || 0; return n > 0 ? `D-${n}` : n === 0 ? "D-DAY" : `D+${-n}`; }
  function isLate(t) { const dl = daysLeft(); return dl != null && t.status !== "done" && (Number(t.dday) || 0) > dl; }
  function sortTasks(a, b) { return (Number(b.dday) || 0) - (Number(a.dday) || 0) || String(a.title).localeCompare(String(b.title), "ko"); }
  function sortedAreas() { return areas.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); }
  function areaName(id) { const a = areas.find(x => x.id === id); return a ? a.name || "업무" : "미분류"; }
  function periodsOn(dd) { return periods.filter(p => dd <= Number(p.startD) && dd >= Number(p.endD)); }
  function ptags(list) { return list.length ? h("span", { class: "ptags" }, list.map(p => h("span", { class: "ptag", style: `background:${pcolor(p.color)}` }, p.name || "기간"))) : null; }
  function toast(msg) { const el = h("div", { class: "toast", role: "status" }, msg); document.body.append(el); setTimeout(() => el.remove(), 2200); }
  const P = c => `events/${cur}/${c}`;
  const canWrite = () => !!db && !readOnly && !noStore;
  function getFocus() { try { return localStorage.getItem(FOCUS_KEY); } catch (e) { return null; } }
  function setFocus(id) { try { id ? localStorage.setItem(FOCUS_KEY, id) : localStorage.removeItem(FOCUS_KEY); } catch (e) {} }

  // ---------- data ----------
  async function save(fn, okMsg) {
    if (!canWrite()) { toast(noStore ? "로그인해야 저장할 수 있어요" : "보기 전용이라 수정할 수 없어요"); return false; }
    try { const r = await fn(); if (okMsg) toast(okMsg); return r === undefined ? true : r; }
    catch (e) {
      if (e && e.code === "invalid_argument") { readOnly = true; toast("이 링크는 보기 전용이에요. 편집 권한을 요청하세요."); render(); }
      else if (e && e.code === "quota_exceeded") toast("저장 공간이 가득 찼어요. 지난 행사를 정리해 주세요.");
      else toast("저장하지 못했어요. 잠시 후 다시 시도해 주세요.");
      return false;
    }
  }
  function cycleStatus(t) {
    const next = STATUS_NEXT[t.status] || "doing";
    save(() => db.doc(P("tasks/" + t.id)).update({ status: next, updatedAt: Date.now() }));
  }
  function pickEvent() {
    if (cur && events.some(e => e.id === cur)) return cur;
    const f = getFocus(); if (f && events.some(e => e.id === f)) return f;
    const up = events.filter(e => { const d = evDays(e); return d != null && d >= -3; }).sort((a, b) => evDays(a) - evDays(b));
    if (up.length) return up[0].id;
    const r = events.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    return r[0] ? r[0].id : null;
  }
  function switchEvent(id) {
    unsubs.forEach(u => u()); unsubs = [];
    cur = id; selDay = null; areas = []; tasks = []; periods = [];
    if (id) setFocus(id);
    evLoaded = !id;
    if (id) {
      let got = 0;
      const sub = (name, assign) => {
        let first = true;
        const mark = () => { if (first) { first = false; if (++got === 3) evLoaded = true; } };
        unsubs.push(db.collection(P(name)).onSnapshot(s => { assign(s.docs.map(d => ({ id: d.id, ...d.data() }))); mark(); render(); },
          () => { mark(); stale = true; render(); }));
      };
      sub("areas", v => areas = v); sub("tasks", v => tasks = v); sub("periods", v => periods = v);
    }
    render();
  }

  // ---------- shared pieces ----------
  function taskRow(t, opts = {}) {
    const late = isLate(t), due = dueOf(t), st = t.status || "todo";
    return h("div", { class: `task${late ? " is-late" : ""}${st === "done" ? " is-done" : ""}` },
      h("button", { type: "button", class: `st ${st}`, "aria-label": `상태: ${STATUS_LABEL[st]} (눌러서 바꾸기)`, onclick: () => cycleStatus(t) }, st === "done" ? svg('<path d="M5 12l5 5 9-10"/>') : null),
      h("button", { type: "button", class: "t-body", onclick: () => openTask(t) },
        h("span", { class: "t-title" }, t.title || "(제목 없음)"),
        h("span", { class: "t-meta" },
          h("span", { class: "d" }, ddLabel(t.dday)),
          due ? h("span", null, fmt(due)) : null,
          opts.hideArea ? null : h("span", { class: "pill" }, areaName(t.areaId)),
          t.owner ? h("span", null, "· " + t.owner) : null,
          late ? h("span", { class: "pill late" }, "기한 지남") : st === "doing" ? h("span", { class: "pill doing" }, "진행 중") : null),
        t.note ? h("span", { class: "t-note" }, t.note) : null));
  }
  function list(items, opts, emptyMsg) {
    return items.length ? h("div", { class: "list" }, items.map(t => taskRow(t, opts))) : h("p", { class: "empty" }, emptyMsg);
  }
  function eventBar() {
    const ev = curEvent();
    return h("div", { class: "evbar" },
      h("button", { type: "button", class: "ev-switch", onclick: openEventList, "aria-label": "행사 바꾸기" },
        h("span", { class: "lbl" }, "행사"),
        h("span", { class: "nm" }, ev ? ev.name || "이름 없는 행사" : "행사 선택"),
        events.length > 1 ? h("span", { class: "ev-count" }, events.length + "개") : null,
        svg('<path d="M6 9l6 6 6-6"/>', 2.4)),
      canWrite() ? h("button", { type: "button", class: "btn small", onclick: () => openEventForm(null) }, "+ 새 행사") : null);
  }
  function hero() {
    const ev = curEvent(), dl = daysLeft(), e = eventDate();
    const big = dl == null ? "D-?" : dl > 0 ? `D-${dl}` : dl === 0 ? "D-DAY" : `D+${-dl}`;
    return h("button", { type: "button", class: "hero", onclick: () => openEventForm(ev), "aria-label": "행사 정보 수정" },
      h("span", { class: "eyebrow" }, "지금 집중하는 행사"),
      h("h1", null, ev.name || "이름 없는 행사"),
      h("span", { class: "row" },
        h("span", { class: "dday" }, big),
        h("span", { class: "meta" }, e ? `${e.getFullYear()}. ${fmt(e)}${ev.place ? " · " + ev.place : ""}` : "날짜를 넣으면 일정이 계산돼요")),
      dl != null ? ptags(periodsOn(dl)) : null,
      h("span", { class: "edit" }, e ? "행사 정보 수정" : "행사 날짜 설정하기"));
  }
  function starter() {
    return h("section", { class: "card starter" },
      h("h2", null, "첫 행사를 만들어 보세요"),
      h("p", null, "행사 이름과 날짜를 정하면, 업무별로 할 일을 직접 만들고 한 달 달력에서 일정을 볼 수 있어요. 행사는 여러 개 만들 수 있어요."),
      canWrite() ? h("button", { type: "button", class: "btn tape", style: "flex:none", onclick: () => openEventForm(null) }, "+ 행사 만들기") : null);
  }

  // ---------- views ----------
  function viewHome() {
    const dl = daysLeft();
    const open = tasks.filter(t => t.status !== "done");
    let focus;
    if (dl == null) focus = open.filter(t => t.status === "doing").concat(open.filter(t => t.status !== "doing").sort(sortTasks).slice(0, 5));
    else focus = open.filter(t => isLate(t) || t.status === "doing" || (Number(t.dday) || 0) >= dl - 6);
    focus = focus.sort(sortTasks);
    const later = open.filter(t => !focus.includes(t)).sort(sortTasks).slice(0, 5);
    const nothingYet = !tasks.length;
    return [
      hero(),
      h("section", { class: "list" },
        h("h2", { class: "sec-title" }, "지금 집중할 일", h("small", null, dl == null ? "진행 중 · 가까운 마감" : "기한 지남 · 진행 중 · 7일 안 마감")),
        nothingYet
          ? h("div", { class: "card starter" },
              h("p", null, "아직 할 일이 없어요. 업무별 탭에서 업무를 만들고 할 일을 추가하면 여기에 떠요."),
              h("button", { type: "button", class: "btn primary", style: "flex:none", onclick: () => setTab("area") }, "업무별에서 할 일 만들기"))
          : list(focus, {}, "지금 급한 일은 없어요. 아래 다음 할 일을 확인해 보세요.")),
      later.length ? h("section", { class: "list" }, h("h2", { class: "sec-title" }, "그다음 할 일", h("small", null, "마감 순")), list(later, {}, "")) : null,
    ];
  }

  function viewPlan() {
    const title = h("h2", { class: "sec-title" }, "한 달 플랜", h("small", null, planMode === "cal" ? "날짜를 눌러 할 일 보기" : "D-30 → 행사 후"));
    const seg = h("div", { class: "seg", role: "group", "aria-label": "보기 방식" },
      [["cal", "달력"], ["list", "단계별 목록"]].map(([k, l]) => h("button", { type: "button", "aria-pressed": String(k === planMode), onclick: () => { planMode = k; render(); } }, l)));
    if (planMode === "list") return [title, seg, ...viewPlanList()];
    const e = eventDate();
    if (!e) return [title, seg, h("div", { class: "card starter" },
      h("p", null, "행사 날짜를 정하면 D-day 기준으로 한 달 달력과 기간 막대가 그려져요."),
      h("button", { type: "button", class: "btn primary", style: "flex:none", onclick: () => openEventForm(curEvent()) }, "행사 날짜 설정하기"))];

    const ds = tasks.map(t => Number(t.dday) || 0), ps = periods.flatMap(p => [Number(p.startD) || 0, Number(p.endD) || 0]);
    const hi = Math.max(30, ...ds, ...ps), lo = Math.min(0, ...ds, ...ps);
    const first = addDays(e, -hi), last = addDays(e, -lo);
    const dl = daysLeft();
    if (selDay == null || selDay > hi || selDay < lo) selDay = dl != null && dl <= hi && dl >= lo ? dl : 0;
    const byDay = {};
    tasks.forEach(t => { const d = Number(t.dday) || 0; (byDay[d] = byDay[d] || []).push(t); });

    const cal = h("div", { class: "cal", role: "grid", "aria-label": "한 달 준비 달력" },
      h("div", { class: "dow", "aria-hidden": "true" }, WEEK.map(w => h("span", null, w))));
    for (let ws = addDays(first, -first.getDay()); ws <= last; ws = addDays(ws, 7)) {
      const week = h("div", { class: "week", role: "row" });
      for (let i = 0; i < 7; i++) {
        const d = addDays(ws, i), dd = ddOf(d), items = byDay[dd] || [];
        const inRange = d >= first && d <= last;
        const dots = h("span", { class: "dots", "aria-hidden": "true" },
          items.slice(0, 3).map(t => h("i", { class: isLate(t) ? "late" : t.status || "todo" })),
          items.length > 3 ? h("b", null, "+" + (items.length - 3)) : null);
        week.append(h("button", {
          type: "button", role: "gridcell",
          class: `day${i === 0 ? " sun" : ""}${inRange ? "" : " out"}${dd === dl ? " today" : ""}${dd === 0 ? " event" : ""}${dd === selDay ? " sel" : ""}`,
          style: `grid-column:${i + 1}`,
          "aria-label": `${fmt(d)} ${ddLabel(dd)}${dd === 0 ? " 행사일" : ""}, 할 일 ${items.length}건`,
          "aria-selected": String(dd === selDay),
          onclick: () => { selDay = dd; render(); },
        }, h("span", { class: "mon" }, d.getDate() === 1 || (i === 0 && ws <= first) ? `${d.getMonth() + 1}월` : ""), h("span", { class: "n" }, d.getDate()), dots));
      }
      const wsDD = ddOf(ws);
      const segs = periods.map(p => {
        const sD = Number(p.startD) || 0, eD = Number(p.endD) || 0;
        const cols = [0, 1, 2, 3, 4, 5, 6].filter(i => { const dd = wsDD - i; return dd <= sD && dd >= eD; });
        if (!cols.length) return null;
        const s = cols[0], en = cols[cols.length - 1];
        return { p, s, en, cl: wsDD - s < sD, cr: wsDD - en > eD };
      }).filter(Boolean).sort((a, b) => a.s - b.s || (b.en - b.s) - (a.en - a.s));
      const laneEnd = [];
      for (const sg of segs) {
        let lane = laneEnd.findIndex(x => x < sg.s);
        if (lane === -1) { lane = laneEnd.length; laneEnd.push(sg.en); } else laneEnd[lane] = sg.en;
        week.append(h("button", {
          type: "button", class: `pbar${sg.cl ? " cl" : ""}${sg.cr ? " cr" : ""}`,
          style: `grid-row:${lane + 2};grid-column:${sg.s + 1} / ${sg.en + 2};background:${pcolor(sg.p.color)}`,
          "aria-label": `${sg.p.name || "기간"} 기간 수정`, onclick: () => openPeriod(sg.p),
        }, sg.p.name || "기간"));
      }
      cal.append(week);
    }

      h("div", { class: "field" }, h("span", { class: "lab" }, "막대 색"), sw),
      h("div", { class: "two" },
        h("div", { class: "field" }, h("label", { for: "p-start" }, "시작일"), fStart),
        h("div", { class: "field" }, h("label", { for: "p-end" }, "종료일"), fEnd)),
      hint,
      h("div", { class: "actions" }, delBtn, h("button", { type: "button", class: "btn", onclick: closeSheet }, "닫기"), h("button", { type: "submit", class: "btn primary" }, isNew ? "추가하기" : "저장하기")));
    lockIfReadOnly(form);
    openSheet(isNew ? "기간 추가" : "기간 수정", [form]);
  }

  // ---------- local storage (used outside claude.ai, e.g. GitHub Pages) ----------
  function localDB() {
    const KEY = "event-prep-board-v2";
    let state = null;
    try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!state || typeof state !== "object") state = {};
    const subs = new Set();
    const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} subs.forEach(f => f()); };
    const meta = { fromCache: false, hasPendingWrites: false };
    const col = c => (state[c] = state[c] || {});
    const snap = (c, id) => ({ id, exists: !!col(c)[id], data: () => col(c)[id], metadata: meta });
    const docRef = (c, id) => ({
      id,
      get: async () => snap(c, id),
      set: async d => { col(c)[id] = { ...d }; persist(); },
      update: async d => { if (!col(c)[id]) throw { code: "invalid_argument" }; col(c)[id] = { ...col(c)[id], ...d }; persist(); },
      delete: async () => { delete col(c)[id]; persist(); },
      onSnapshot: next => { const f = () => next(snap(c, id)); subs.add(f); setTimeout(f); return () => subs.delete(f); },
    });
    const qsnap = c => { const docs = Object.keys(col(c)).map(id => snap(c, id)); return { docs, size: docs.length, empty: !docs.length, metadata: meta }; };
    const colRef = c => ({
      doc: id => docRef(c, id || "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7)),
      add: async d => { const r = colRef(c).doc(); await r.set(d); return r; },
      get: async () => qsnap(c),
      onSnapshot: next => { const f = () => next(qsnap(c)); subs.add(f); setTimeout(f); return () => subs.delete(f); },
    });
    return {
      doc: p => { const i = p.lastIndexOf("/"); return docRef(p.slice(0, i), p.slice(i + 1)); },
      collection: colRef,
    };
  }

  // ---------- boot ----------
  async function boot() {
    const claude = window.claude;
    if (claude && claude.use) {
      db = await claude.use("db").catch(() => null);
      if (!db) noStore = true;
      else {
        const user = await claude.use("user").catch(() => null);
        if (user && (await user.can("data.write")) === false) readOnly = true;
      }
    } else { db = localDB(); localMode = true; }
    if (!db) { eventsLoaded = true; render(); return; }
    const timer = setTimeout(() => { stale = true; render(); }, 10000);
    db.collection("events").onSnapshot(s => {
      events = s.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!s.metadata.fromCache) { clearTimeout(timer); stale = false; }
      eventsLoaded = true;
      const want = pickEvent();
      if (want !== cur || (want && !unsubs.length)) switchEvent(want); else render();
    }, () => { clearTimeout(timer); eventsLoaded = true; stale = true; render(); });
  }
  render();
  boot();
})();
</script>
